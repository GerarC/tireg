services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tireg
      POSTGRES_PASSWORD: tireg
      POSTGRES_DB: tireg
      POSTGRES_SSLMODE: disable
      JWT_SECRET: change-me
      JWT_EXPIRATION_MINUTES: "60"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tireg
      POSTGRES_PASSWORD: tireg
      POSTGRES_DB: tireg
    volumes:
      - tireg-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tireg -d tireg"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tireg-postgres-data:
