host: localhost:8080
info:
  contact: {}
  description: Backend for time registration, projects, and glossary management.
  title: tireg API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns a signed JWT access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_auth_infrastructure_in_rest_v1_dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_auth_infrastructure_in_rest_v1_dto.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      summary: Authenticate a user
      tags:
      - auth
  /api/v1/glossary:
    get:
      description: Returns every glossary type and project owned by the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Get the authenticated user's glossary
      tags:
      - glossary
  /api/v1/glossary/projects:
    get:
      description: Returns every glossary project owned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryProjectResponseDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: List glossary projects
      tags:
      - glossary
    post:
      consumes:
      - application/json
      description: Creates a new glossary project owned by the authenticated user
      parameters:
      - description: Glossary project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryProjectRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryProjectResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Create a glossary project
      tags:
      - glossary
  /api/v1/glossary/projects/{id}:
    delete:
      description: Deletes a glossary project owned by the authenticated user
      parameters:
      - description: Glossary project id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Delete a glossary project
      tags:
      - glossary
    put:
      consumes:
      - application/json
      description: Updates a glossary project owned by the authenticated user
      parameters:
      - description: Glossary project id
        in: path
        name: id
        required: true
        type: string
      - description: Glossary project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryProjectRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryProjectResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Update a glossary project
      tags:
      - glossary
  /api/v1/glossary/types:
    get:
      description: Returns every glossary type owned by the authenticated user, seeding
        the defaults on first access
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryTypeResponseDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: List glossary types
      tags:
      - glossary
    post:
      consumes:
      - application/json
      description: Creates a new glossary type owned by the authenticated user
      parameters:
      - description: Glossary type payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryTypeRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryTypeResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Create a glossary type
      tags:
      - glossary
  /api/v1/glossary/types/{id}:
    delete:
      description: Deletes a glossary type owned by the authenticated user
      parameters:
      - description: Glossary type id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Delete a glossary type
      tags:
      - glossary
    put:
      consumes:
      - application/json
      description: Updates a glossary type owned by the authenticated user
      parameters:
      - description: Glossary type id
        in: path
        name: id
        required: true
        type: string
      - description: Glossary type payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryTypeRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_glossary_infrastructure_in_rest_v1_dto.GlossaryTypeResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      security:
      - BearerAuth: []
      summary: Update a glossary type
      tags:
      - glossary
  /api/v1/health:
    get:
      description: Returns the current health status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_health_infrastructure_in_rest_v1_dto.HealthResponseDTO'
      summary: Check service health
      tags:
      - health
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Creates a new user account with a hashed password
      parameters:
      - description: User registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gerarc_tireg_internal_user_infrastructure_in_rest_v1_dto.UserRegisterRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_user_infrastructure_in_rest_v1_dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_gerarc_tireg_internal_shared_infrastructure_in_rest.ErrorResponseDTO'
      summary: Register a new user
      tags:
      - user
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token returned
      by /api/v1/auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
