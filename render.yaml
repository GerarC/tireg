services:
  - type: web
    name: tireg
    runtime: go
    plan: free
    buildCommand: go build -o app ./cmd/tireg
    startCommand: ./app
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: LOG_LEVEL
        value: info
